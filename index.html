<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8fbff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="保証ガイド" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>保証グレードアップガイド</title>
  <style>
    :root{
      --bg:#f6f9fe;--card:#fff;--text:#14213d;--muted:#61708c;--line:#e6edf8;
      --blue:#1367d8;--pink:#ed3f7a;--cyan:#16a6cf;--green:#18a86b;--purple:#7048d8;
      --shadow:0 12px 30px rgba(22,54,93,.10);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    button{font:inherit}
    .app{min-height:100vh;display:flex;flex-direction:column}
    header{position:sticky;top:0;z-index:10;background:rgba(248,251,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .bar{height:72px;max-width:1400px;margin:auto;padding:0 22px;display:flex;align-items:center;gap:14px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(20px,2.5vw,30px)}
    .brandmark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#1683ef,#6b49e3);color:#fff;box-shadow:0 7px 16px rgba(28,105,216,.24)}
    .version{margin-left:auto;font-size:12px;color:var(--muted);font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    main{width:min(1400px,100%);margin:0 auto;padding:30px 22px 40px;flex:1}
    .hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}
    .hero h1{margin:0 0 8px;font-size:clamp(28px,4.2vw,48px);line-height:1.08;letter-spacing:-.02em}
    .hero p{margin:0;color:var(--muted);font-size:clamp(15px,2vw,19px);font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:var(--shadow);padding:0;text-align:left;min-height:190px;cursor:pointer;transition:.18s transform,.18s box-shadow}
    .card:active{transform:scale(.985)}
    .card-inner{padding:24px;display:grid;grid-template-columns:88px 1fr 44px;align-items:center;gap:20px;min-height:190px}
    .icon{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;font-size:42px;background:linear-gradient(145deg,#f1f6ff,#fff);border:1px solid #e2eaf8}
    .card h2{margin:0 0 8px;font-size:clamp(23px,3vw,32px);line-height:1.15}
    .card p{margin:0;color:var(--muted);font-size:15px;font-weight:700;line-height:1.55}
    .go{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eff5ff;color:var(--blue);font-size:28px;font-weight:900}
    .accent{position:absolute;inset:0 auto 0 0;width:7px;background:var(--accent)}
    .wide{grid-column:1/-1}
    .wide .card-inner{grid-template-columns:88px 1fr 44px}
    .detail{display:none}
    .detail.active{display:block}
    .home.hidden{display:none}
    .detailTop{display:flex;align-items:center;gap:14px;margin-bottom:18px}
    .back{border:0;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(26,55,91,.07);width:52px;height:52px;border-radius:16px;font-size:28px;font-weight:900;color:var(--text);cursor:pointer}
    .detailTitle{font-size:clamp(24px,3.2vw,36px);font-weight:900}
    .imageWrap{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:10px;overflow:hidden}
    .imageWrap img{display:block;width:100%;height:auto;border-radius:16px}
    .hint{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin-top:12px}
    .bottomHome{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));z-index:15;width:58px;height:58px;border:0;border-radius:20px;background:#14213d;color:#fff;box-shadow:0 12px 25px rgba(20,33,61,.22);font-size:25px;display:none}
    .bottomHome.show{display:block}
    @media (min-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wide{grid-column:auto}.card-inner{grid-template-columns:78px 1fr 36px}.icon{width:78px;height:78px}}
    @media (max-width:700px){.bar{height:62px;padding:0 14px}.brandmark{width:38px;height:38px}.version{font-size:11px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}main{padding:22px 14px 32px}.card-inner{min-height:142px;padding:18px;grid-template-columns:66px 1fr 36px;gap:14px}.icon{width:66px;height:66px;border-radius:19px;font-size:34px}.card p{font-size:13px}.hero{margin-bottom:18px}.imageWrap{padding:5px;border-radius:18px}.imageWrap img{border-radius:13px}}
  </style>
</head>
<body>
<div class="app">
<header><div class="bar"><div class="brand"><div class="brandmark">✓</div><span>保証グレードアップガイド</span></div><div class="version">Ver. 1.0.0</div></div></header>
<main>
  <section id="home" class="home">
    <div class="hero"><div><h1>商品別に、保証の違いをすぐ案内</h1><p>接客中に見せやすい5つの保証ガイドを1つにまとめました。</p></div></div>
    <div class="grid">
      <button class="card" style="--accent:#ef3f79" data-page="washer"><span class="accent"></span><div class="card-inner"><div class="icon">🧺</div><div><h2>洗濯機</h2><p>保証グレードアップ＋洗濯槽クリーナー500円引きクーポン</p></div><div class="go">›</div></div></button>
      <button class="card" style="--accent:#29b97b" data-page="fridge"><span class="accent"></span><div class="card-inner"><div class="icon">❄️</div><div><h2>冷蔵庫</h2><p>保証グレードアップ＋キズ防止ゴムマット特典</p></div><div class="go">›</div></div></button>
      <button class="card" style="--accent:#0d64d9" data-page="tv"><span class="accent"></span><div class="card-inner"><div class="icon">📺</div><div><h2>テレビ・レコーダー</h2><p>無料保証から完全保証までを見やすく比較</p></div><div class="go">›</div></div></button>
      <button class="card" style="--accent:#f16035" data-page="aircon"><span class="accent"></span><div class="card-inner"><div class="icon">🌬️</div><div><h2>エアコン</h2><p>工事保証・雷保証・安心サポートまでまとめて案内</p></div><div class="go">›</div></div></button>
      <button class="card wide" style="--accent:#5f55d9" data-page="failure"><span class="accent"></span><div class="card-inner"><div class="icon">🛡️</div><div><h2>自然故障・物損故障</h2><p>「何が自然故障？」「物損はどんな時？」をシンプルに説明</p></div><div class="go">›</div></div></button>
    </div>
  </section>

  <section id="washer" class="detail"><div class="detailTop"><button class="back" aria-label="戻る">‹</button><div class="detailTitle">洗濯機</div></div><div class="imageWrap"><img src="assets/washer.png" alt="洗濯機 保証グレードアップ案内"></div><div class="hint">画像はピンチ操作で拡大できます</div></section>
  <section id="fridge" class="detail"><div class="detailTop"><button class="back" aria-label="戻る">‹</button><div class="detailTitle">冷蔵庫</div></div><div class="imageWrap"><img src="assets/fridge.png" alt="冷蔵庫 保証グレードアップ案内"></div><div class="hint">画像はピンチ操作で拡大できます</div></section>
  <section id="tv" class="detail"><div class="detailTop"><button class="back" aria-label="戻る">‹</button><div class="detailTitle">テレビ・レコーダー</div></div><div class="imageWrap"><img src="assets/tv.png" alt="テレビ・レコーダー 保証グレードアップ案内"></div><div class="hint">画像はピンチ操作で拡大できます</div></section>
  <section id="aircon" class="detail"><div class="detailTop"><button class="back" aria-label="戻る">‹</button><div class="detailTitle">エアコン</div></div><div class="imageWrap"><img src="assets/aircon.png" alt="エアコン 保証グレードアップ案内"></div><div class="hint">画像はピンチ操作で拡大できます</div></section>
  <section id="failure" class="detail"><div class="detailTop"><button class="back" aria-label="戻る">‹</button><div class="detailTitle">自然故障・物損故障</div></div><div class="imageWrap"><img src="assets/failure.png" alt="自然故障と物損故障の違い"></div><div class="hint">画像はピンチ操作で拡大できます</div></section>
</main>
<button id="bottomHome" class="bottomHome" aria-label="ホームへ">⌂</button>
</div>
<script>
const home=document.getElementById('home');const bottom=document.getElementById('bottomHome');
function showHome(){document.querySelectorAll('.detail').forEach(x=>x.classList.remove('active'));home.classList.remove('hidden');bottom.classList.remove('show');history.replaceState(null,'','#home');window.scrollTo({top:0,behavior:'instant'});}
function showPage(id){home.classList.add('hidden');document.querySelectorAll('.detail').forEach(x=>x.classList.toggle('active',x.id===id));bottom.classList.add('show');history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'instant'});}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',showHome));bottom.addEventListener('click',showHome);
const id=location.hash.slice(1); if(id && document.getElementById(id)?.classList.contains('detail')) showPage(id); else showHome();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
